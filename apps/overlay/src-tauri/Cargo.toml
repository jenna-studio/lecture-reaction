[package]
name = "lecture-react"
version = "0.1.0"
description = "Lecture React — transparent always-on-top lecture reaction overlay"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri v2 mobile targets expect a lib; the desktop binary just calls into it.
name = "lecture_react_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for a genuinely transparent window on macOS.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by `tauri dev`/`tauri build` for the default production profile.
default = []
